name: audio_tags_lofty
description: >
  Lofty (Rust) backend for audio_tags. Reads and writes MP3, FLAC, MP4,
  Vorbis, Opus, WAV, AIFF, APE, and more via FFI. Ships prebuilt binaries.
version: 0.1.0
publish_to: https://myclub.birju.dev
repository: https://github.com/birjuvachhani/audio_tags
issue_tracker: https://github.com/birjuvachhani/audio_tags/issues

topics:
  - audio
  - metadata
  - lofty
  - id3
  - tags

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  audio_tags_interface: ^0.1.0
  code_assets: ^1.0.0
  ffi: ^2.2.0
  hooks: ^1.0.0
  logging: ^1.3.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0
